<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Oliver Velez Black Friday 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: coluna de leitura ~1040px; painel de premissas fixo; vermelho = EUA/prioridade, demais cores = mercados */
:root{
  --bg:#f4f5f7; --surface:#fff; --fg:#14171c; --muted:#5d6570; --line:#dde0e5; --soft:#eceef2;
  --red:#cf2e22; --red-soft:#fbe9e7; --ink:#2b3644; --c2:#4f6d8f; --c3:#a3afbf; --c4:#c99a3e; --c5:#5f9a7c; --c6:#8a6fb0;
  --good:#1f7a4d; --warn:#a15c00;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --surface:#171a1f; --fg:#e7e9ec; --muted:#9aa2ad; --line:#2a2f37; --soft:#20242b;
  --red:#ff6a5c; --red-soft:#3a1d1a; --ink:#c9d1db; --c2:#7f9fc4; --c3:#5d6878; --c4:#d9b874; --c5:#7fb096; --c6:#a993cc;
  --good:#5fd39a; --warn:#f0b35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --fg:#e7e9ec; --muted:#9aa2ad; --line:#2a2f37; --soft:#20242b;
  --red:#ff6a5c; --red-soft:#3a1d1a; --ink:#c9d1db; --c2:#7f9fc4; --c3:#5d6878; --c4:#d9b874; --c5:#7fb096; --c6:#a993cc;
  --good:#5fd39a; --warn:#f0b35a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:36px 80px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(32px,5.6vw,54px);font-weight:800;font-stretch:78%;text-transform:uppercase}
h1 .r{color:var(--red)}
h2{font-size:24px;font-weight:750;font-stretch:85%;text-transform:uppercase}
h3{font-size:16px;font-weight:700;font-stretch:95%}
p{margin:0;max-width:72ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:16.5px;color:var(--muted)}
header{display:grid;gap:12px;padding-bottom:24px;border-bottom:3px solid var(--fg)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
section{display:grid;gap:16px;padding-block:40px 4px}
.num{font-family:var(--f-mono);color:var(--red);font-size:13px;letter-spacing:.08em}
.sec-head{display:grid;gap:6px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:4px;min-width:0;align-content:start}
.tile .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:750;font-stretch:85%;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:12.5px;color:var(--muted)}
.scen{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:10px;min-width:0;align-content:start}
.sc.meta-c{border-color:var(--fg);border-width:2px}
.sc .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc .lab span{font-family:var(--f-display);font-weight:750;font-stretch:85%;text-transform:uppercase;font-size:17px}
.sc .lab small{font:500 12px var(--f-mono);color:var(--muted)}
.sc .big{font-family:var(--f-display);font-size:32px;font-weight:750;font-stretch:85%;font-variant-numeric:tabular-nums;line-height:1}
.sc .big small{font-size:14px;font-weight:600;color:var(--muted)}
.sc dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:13px;font-variant-numeric:tabular-nums}
.sc dt{color:var(--muted)} .sc dd{margin:0;text-align:right;font-weight:600}
.sc dd span{color:var(--muted);font-weight:400}
.badge{display:inline-block;font:600 11.5px var(--f-mono);padding:3px 8px;border-radius:4px}
.badge.ok{background:var(--good);color:var(--surface)} .badge.no{background:var(--red);color:var(--surface)}
.ok{color:var(--good)} .no{color:var(--red)}
.panel{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.ctl{display:grid;gap:2px;min-width:160px;flex:1 1 160px}
.ctl label{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctl label b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.ctl input{width:100%;accent-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{font:500 12.5px var(--f-body);padding:7px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
tr.total td{font-weight:600;background:var(--soft)}
tr.us td{background:var(--red-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.charts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0;display:grid;gap:8px;align-content:start}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:6px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.insights{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.insights li{padding-left:18px;position:relative;max-width:80ch}
.insights li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:2px;background:var(--red)}
.mk-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:10px;min-width:0;align-content:start}
.box h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.box h3 small{font:500 12px var(--f-mono);color:var(--muted)}
.box ul{margin:0;padding-left:18px;display:grid;gap:6px}
.box .role{font-size:12.5px;color:var(--muted)}
.foot{margin-top:52px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
table.compact{font-size:13px}
table.compact th,table.compact td{padding:9px 6px}
table.compact thead th{font-size:10.5px;letter-spacing:.03em}
table.compact tr td:first-child{font-weight:600}
</style>

<div class="wrap">
<header>
  <div class="topbar"><div class="eyebrow" data-i="eyebrow"></div>
    <div class="seg" role="group" aria-label="Idioma / Idioma"><button id="lg-pt" data-lang="pt" aria-pressed="true">Português</button><button id="lg-es" data-lang="es" aria-pressed="false">Español</button></div></div>
  <h1 data-i="h1"></h1>
  <p class="lede" data-i="lede"></p>
  <div class="meta" data-i="meta"></div>
</header>

<section id="cenarios">
  <div class="sec-head"><span class="num" data-i="n1"></span><h2 data-i="h_scen"></h2><p class="lede" data-i="scen_lede"></p></div>
  <div class="scen" id="scen"></div>
</section>

<section id="resumo">
  <div class="sec-head"><span class="num" data-i="n2"></span><h2 data-i="h_paid"></h2></div>
  <div class="tiles" id="tiles"></div>
  <ul class="insights" id="res-ins"></ul>
</section>

<section id="investimento">
  <div class="sec-head"><span class="num" data-i="n3"></span><h2 data-i="h_inv"></h2></div>
  <div class="charts">
    <div class="chart"><h3 data-i="ch_mix"></h3><div id="ch-mix"></div></div>
    <div class="chart"><h3 data-i="ch_leads"></h3><div id="ch-leads"></div><div class="legend"><span><i class="sw" style="background:var(--muted)"></i><span data-i="lg_mark"></span></span></div></div>
  </div>
  <div class="tbl-wrap"><table id="t-mkt"></table></div>
  <ul class="insights" data-i="inv_ins"></ul>
</section>

<section id="cpl">
  <div class="sec-head"><span class="num" data-i="n3b"></span><h2 data-i="h_cpl"></h2><p class="lede" data-i="cpl_lede"></p></div>
  <div class="charts">
    <div class="chart"><h3 data-i="ch_cpl"></h3><div id="ch-cpl"></div><div class="legend"><span><i class="sw" style="background:var(--fg)"></i><span data-i="lg_avg"></span></span></div></div>
    <div class="chart"><h3 data-i="ch_lang"></h3><table id="t-lang" class="compact"></table></div>
  </div>
  <div class="tbl-wrap"><table id="t-cpl"></table></div>
  <ul class="insights" id="cpl-ins"></ul>
</section>

<section id="calendario">
  <div class="sec-head"><span class="num" data-i="n4"></span><h2 data-i="h_cal"></h2></div>
  <div class="chart"><h3 data-i="ch_week"></h3><div id="ch-week"></div>
    <div class="legend" data-i="lg_week"></div></div>
  <div class="tbl-wrap"><table id="t-week"></table></div>
  <ul class="insights" data-i="cal_ins"></ul>
</section>




<section id="temp">
  <div class="sec-head"><span class="num" data-i="n6"></span><h2 data-i="h_temp"></h2><p class="lede" data-i="temp_lede"></p></div>
  <div class="tiles" id="temp-tiles"></div>
  <div class="chart"><h3 data-i="ch_temp"></h3><div id="ch-temp"></div><div class="legend" data-i="lg_temp"></div></div>
  <div class="tbl-wrap"><table id="t-temp"></table></div>
</section>
</div>

const SW=c=>`<i class="sw" style="background:${c}"></i>`;
const I18N={
pt:{

 temp_lede:'Na Black Friday, a ideia é investir o máximo possível em público quente: quem já é lead, já viu a masterclass ou já interagiu com o Oliver conhece a oferta e reconhece o desconto na hora. O frio existe para encher essa base durante a captação. Na janela de venda, 100% da verba vai para o quente.',

 th_temp:['Fase','Datas','Frio','Quente','Total','% quente'],
 ph:[['Captação · outubro','5–31/out'],['Captação · novembro','1–20/nov'],['Venda','21–30/nov']],

 ch_cpl:'CPL projetado por país',lg_avg:'Linha = CPL médio Meta',ch_lang:'Leads pagos por idioma',

 n1:'01 · CENÁRIOS',h_scen:'O que é preciso para bater cada meta de receita',

 sc_conv:'Conversão lead → venda',sc_sales:'Vendas necessárias',sc_need:'Leads necessários',sc_proj:'Leads projetados',sc_org:'Orgânicos (blueprint)',sc_paidneed:'Pagos necessários',sc_paidproj:'Pagos projetados',sc_cplmax:'CPL máximo Meta',sc_cplproj:'CPL projetado Meta',sc_roas:'ROAS sobre US$ 75 mil',sc_ok:'Leads suficientes',sc_miss:n=>`Faltam ${n} leads pagos`,

  $('#temp-tiles').innerHTML=t.temp_tiles(usd(F),usd(Q),pct(F/TOTAL,0),pct(Q/TOTAL,0)).map(([k,v,s])=>`<div class="tile"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`).join('');
  const W=900,rh=46,pl=170,pr=90,H=P.length*rh+6,max=40000,sc=v=>(W-pl-pr)*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.ch_temp}">`;
  P.forEach((p,i)=>{const y=4+i*rh,wf=sc(p.f),wq=sc(p.q);
    s+=`<text x="${pl-10}" y="${y+16}" text-anchor="end" font-size="12.5" font-weight="600" font-family="var(--f-body)" fill="var(--fg)">${t.ph[i][0]}</text><text x="${pl-10}" y="${y+31}" text-anchor="end" font-size="10.5" font-family="var(--f-mono)" fill="var(--muted)">${t.ph[i][1]}</text>`;
    s+=`<rect x="${pl}" y="${y+4}" width="${wf}" height="28" fill="var(--ink)"/><rect x="${pl+wf}" y="${y+4}" width="${wq}" height="28" fill="var(--red)"/>`;
    if(wf>70)s+=`<text x="${pl+8}" y="${y+22}" font-size="11.5" font-family="var(--f-mono)" fill="var(--surface)">${usdK(p.f)}</text>`;
    if(wq>70)s+=`<text x="${pl+wf+8}" y="${y+22}" font-size="11.5" font-family="var(--f-mono)" fill="var(--surface)">${usdK(p.q)}</text>`;
    s+=`<text x="${pl+wf+wq+8}" y="${y+22}" font-size="11.5" font-weight="600" font-family="var(--f-mono)" fill="var(--fg)">${pct(p.q/(p.f+p.q),0)}</text>`});
  $('#ch-temp').innerHTML=s+'</svg>';
  $('#t-temp').innerHTML='<thead><tr>'+t.th_temp.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
   P.map((p,i)=>`<tr><td>${t.ph[i][0]}</td><td>${t.ph[i][1]}</td><td>${usd(p.f)}</td><td>${usd(p.q)}</td><td>${usd(p.f+p.q)}</td><td>${pct(p.q/(p.f+p.q),0)}</td></tr>`).join('')+
   `<tr class="total"><td>${t.total}</td><td>${t.period}</td><td>${usd(F)}</td><td>${usd(Q)}</td><td>${usd(TOTAL)}</td><td>${pct(Q/TOTAL,0)}</td></tr></tbody>`;
}

  const t=T();
  document.documentElement.lang=LANG==='es'?'es':'pt-BR';
  document.querySelectorAll('[data-i]').forEach(el=>el.innerHTML=t[el.dataset.i]);
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG?'true':'false'));
  scen();tiles();mktTable();cplSec();weekChart();tempSec();
  barsH('#ch-mix',rows.map(r=>({k:nm(r),v:r.spP,c:r.col,s:r.share})),i=>`${usdK(i.v)} · ${pct(i.s,1)}`,t.aria_mix,120);
  barsH('#ch-leads',rows.map(r=>({k:nm(r),v:r.ldP,c:r.col,m:r.plan})),i=>n0(i.v),t.aria_leads);
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;try{localStorage.setItem('ov-bf-lang',LANG)}catch(e){}render()}));
render();
